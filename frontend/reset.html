<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Chat App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1>🔐 Naya Password</h1>
            <p class="subtitle">Apna naya password set karein</p>

            <div class="form-section">
                <div class="password-wrapper">
                    <input type="password" id="newPassword" placeholder="Naya password" required>
                    <button type="button" class="eye-btn" onclick="togglePassword('newPassword')">👁️</button>
                </div>
                <button class="btn-primary" onclick="setNewPassword()">Set Password</button>
                <p id="resetError" class="error-msg"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, isSignInWithEmailLink, signInWithEmailLink, updatePassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIO8IbZzQMwY27QU5hJENKlWwHDI8NBDA",
            authDomain: "chat-app-2e5d3.firebaseapp.com",
            projectId: "chat-app-2e5d3",
            storageBucket: "chat-app-2e5d3.firebasestorage.app",
            messagingSenderId: "842207618087",
            appId: "1:842207618087:web:e3d5aefaefffe2b01b5a02"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const firebaseAuth = getAuth(firebaseApp);

        window.togglePassword = function(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === "password" ? "text" : "password";
        };

        window.setNewPassword = async function() {
            const newPassword = document.getElementById("newPassword").value;
            if (!newPassword) {
                document.getElementById("resetError").textContent = "Naya password daalein";
                return;
            }

            if (isSignInWithEmailLink(firebaseAuth, window.location.href)) {
                let email = window.localStorage.getItem('emailForSignIn');
                if (!email) {
                    email = window.prompt('Apni email confirm karein:');
                }
                try {
                    const result = await signInWithEmailLink(firebaseAuth, email, window.location.href);
                    await updatePassword(result.user, newPassword);
                    document.getElementById("resetError").textContent = "Password set ho gaya! Ab login karein";
                    document.getElementById("resetError").style.color = "green";
                    setTimeout(() => window.location.href = "/", 2000);
                } catch (e) {
                    document.getElementById("resetError").textContent = "Error: " + e.message;
                }
            } else {
                document.getElementById("resetError").textContent = "Invalid ya expire link";
            }
        };
    </script>
</body>
</html>
